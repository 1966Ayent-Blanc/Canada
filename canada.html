<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vancouver 8 oct – 21 déc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14302b;--mute:#5d716c;--line:#d5dedb;--pri:#1f5c52;--acc:#e3a72f;--sky:#2f7a96;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b19;--card:#172a27;--ink:#e6efed;--mute:#9bb0ab;--line:#2a403c;--pri:#5cc0ad;--onpri:#0e1b19;--sky:#6cb9d4}}
:root[data-theme="dark"]{--bg:#0e1b19;--card:#172a27;--ink:#e6efed;--mute:#9bb0ab;--line:#2a403c;--pri:#5cc0ad;--onpri:#0e1b19;--sky:#6cb9d4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",-apple-system,system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:30px;line-height:1.1;margin:8px 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;margin:22px 0 8px;font-weight:800}
h3{font-size:16px;margin:0 0 4px;font-weight:600}
p{margin:6px 0}
.sub{color:var(--mute);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--pri);color:var(--onpri);border:0;border-radius:20px;padding:18px}
.hero .big{font-size:44px;font-weight:800;line-height:1}
.hero small{opacity:.85}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.t{min-width:92px;font-weight:600;color:var(--sky)}
.row label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none;margin-top:2px}
input:checked+span{text-decoration:line-through;color:var(--mute)}
.tag{display:inline-block;background:var(--acc);color:#2b2108;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600}
ul{margin:6px 0;padding-left:20px}
li{margin:3px 0}
a{color:var(--sky);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
.we.now{border:2px solid var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 12px "Bricolage Grotesque",system-ui,sans-serif;padding:10px 2px;min-height:56px}
nav button[aria-selected=true]{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
nav button:focus-visible{outline:2px solid var(--sky);outline-offset:-4px}
section{display:none}section.on{display:block}
.note{border-left:4px solid var(--acc);padding:8px 12px;background:var(--card);border-radius:0 10px 10px 0;margin:10px 0}
</style>
</head>
<body>
<main>
<section id="s0" class="on"></section>
<section id="s1"></section>
<section id="s2"></section>
<section id="s3"></section>
<section id="s4"></section>
</main>
<nav role="tablist">
<button role="tab" aria-selected="true" data-i="0">Aujourd'hui</button>
<button role="tab" aria-selected="false" data-i="1">Semaine</button>
<button role="tab" aria-selected="false" data-i="2">Week-ends</button>
<button role="tab" aria-selected="false" data-i="3">Business</button>
<button role="tab" aria-selected="false" data-i="4">Infos</button>
</nav>
<script>
var START=new Date(2026,9,8),END=new Date(2026,11,21),SCH0=new Date(2026,9,12),SCH1=new Date(2026,11,18);
var DAYS=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
var SPORT={
1:["Haut du corps A (75 min)","Échauffement 10 min · développé couché 4×8 · tractions 4×max · développé militaire haltères 3×10 · rowing barre 3×10 · dips 3×10 · tronc : planche 3×45 s, relevés de jambes 3×12, rotations russes 3×20"],
2:["Jambes + gainage (75 min)","Squat 4×8 · soulevé de terre roumain 3×10 · fentes marchées 3×12 · hip thrust 3×12 · mollets 3×15 · planche latérale 3×30 s par côté · roue abdominale 3×10"],
3:["Cardio + mobilité (60 min)","Échauffement 10 min · 8 à 10 intervalles 1 min rapide / 1 min lent · 20 min allure facile · 20 min mobilité hanches, épaules, dos · option : natation 30 min au YMCA"],
4:["Haut du corps B (75 min)","Tractions prise large 4×8 · développé incliné haltères 4×10 · élévations latérales 3×15 · face pulls 3×15 · curl 3×12 · triceps 3×12 · pallof press 3×12 · crunch poulie 3×15"],
5:["Full body + étirements (75 min)","Kettlebell swing 4×15 · pompes 4×12 · tirage horizontal 4×10 · goblet squat 3×12 · farmer walk 3×40 m · burpees 3×10 · 15 min d'étirements complets"]};
var WORK={1:"Bibliothèque centrale (350 W Georgia St)",2:"Coworking VanCubers (997 Seymour St #250)",3:"Coworking VanCubers (997 Seymour St #250)",4:"Bibliothèque centrale (350 W Georgia St)",5:"Coworking VanCubers (997 Seymour St #250)"};
var WE=[
["2026-10-10","10–11 oct","Premiers repères","Sam : Stanley Park (seawall à vélo ou à pied), Granville Island et son marché, Gastown. Dim : Commercial Drive, ton quartier, puis achat des chaussons d'escalade chez Climb On Equipment (42 E Broadway, ouvert 10h–18h)."],
["2026-10-17","17–18 oct","Premier bloc","Sam : salle d'escalade (Hive Bouldering ou Cliffhanger, vérifie prix et horaires) et rencontre de groupes via Meetup. Dim : Lynn Canyon, pont suspendu gratuit."],
["2026-10-24","24–25 oct","Squamish","Randonnée du Stawamus Chief, Shannon Falls, Sea to Sky Gondola. Cherche un covoiturage via Meetup ou une navette."],
["2026-10-31","31 oct–1 nov","Deep Cove","Quarry Rock à pied, kayak sur l'Indian Arm, doughnuts locaux. Samedi soir : Halloween en ville."],
["2026-11-07","7–8 nov","Week-end sur l'île : Victoria","Ferry BC Ferries Tsawwassen–Swartz Bay, nuit à Victoria. Inner Harbour, Butchart Gardens, Beacon Hill, Sooke Potholes. Alternative plus sauvage : Tofino."],
["2026-11-14","14–15 nov","Côte ouest","Sam : Lighthouse Park et Whytecliff Park (Horseshoe Bay). Dim : Museum of Anthropology à UBC et Pacific Spirit Park."],
["2026-11-21","21–22 nov","Richmond","Steveston (village de pêcheurs), dim sum, Aberdeen Centre. Dimanche calme pour le business et le repos."],
["2026-11-28","28–29 nov","Premier ski","Cypress, Grouse, Seymour ou Whistler selon l'enneigement (vérifie les dates d'ouverture). Location skis, chaussures, bâtons et casque sur place."],
["2026-12-05","5–6 déc","Noël en ville","Christkindlmarket (marché de Noël, clin d'œil à la Suisse), VanDusen Festival of Lights, Capilano Canyon Lights. Vérifie les dates."],
["2026-12-12","12–13 déc","Ski n°2","Retourne à la montagne, Whistler si ouvert. Après ce week-end, plus de jours de ski avant ton départ."],
["2026-12-19","19–20 déc","Adieux","Dernière balade à Stanley Park, souvenirs à Gastown, valise. Départ le 21 déc."]];
var BIZ=[
["Semaine 1 (8–14 oct)","Choisir ton idée n°1 : produits numériques immobilier/finance (modèles Excel, guides) ou produit physique","Étudier 10 concurrents (prix, avis, ce qui manque)","Créer la page de vente et la boutique en ligne"],
["Semaine 2 (15–21 oct)","Fabriquer le produit n°1 avec Claude (guide ou modèle prêt à vendre)","Tester l'offre auprès de 10 personnes de ton réseau","Mettre en place le paiement en ligne"],
["Semaine 3 (22–28 oct)","Lancer la vente : publications, groupes, newsletter","Écrire 3 articles utiles sur l'immobilier suisse","Obtenir les 5 premières ventes"],
["Semaine 4 (29 oct–4 nov)","Améliorer le produit selon les retours","Lancer un 2e produit (calculateur de rendement locatif)","Contacter 20 investisseurs ou propriétaires pour des retours"],
["Semaine 5 (5–11 nov)","Créer l'offre de service immobilier (analyse d'un bien, rapport de rendement)","Vérifier les règles de licence avant de la proposer","Signer le premier client payant"],
["Semaine 6 (12–18 nov)","Livrer, facturer, demander des témoignages","Lancer des publicités simples sur les produits qui vendent","Préparer un abonnement mensuel"],
["Semaine 7 (19–25 nov)","Faire le bilan chiffré","Décider quoi continuer depuis la Suisse","Automatiser ce qui se répète"]];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var store={};try{store=JSON.parse(localStorage.getItem("vc")||"{}")}catch(e){}
function save(){try{localStorage.setItem("vc",JSON.stringify(store))}catch(e){}}
function chk(k,txt){return '<div class="row"><label><input type="checkbox" data-k="'+k+'"'+(store[k]?' checked':'')+'><span>'+txt+'</span></label></div>'}
function maps(q){return '<a href="https://maps.apple.com/?q='+encodeURIComponent(q)+'">'+esc(q)+'</a>'}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){
 var n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),dow=d0.getDay(),k=dstr(d0);
 var left=Math.round((END-d0)/864e5),wk=Math.floor((d0-START)/864e5/7)+1;
 var h='<h1>'+DAYS[dow]+' '+d0.getDate()+'/'+(d0.getMonth()+1)+'</h1>';
 h+='<div class="card hero"><div class="big">'+(left>=0?left:0)+'</div><small>jours avant le départ du 21 déc'+(wk>=1&&left>=0?' · semaine '+wk+' sur 11':'')+'</small></div>';
 if(dow>=1&&dow<=5&&(d0<SCH0||d0>SCH1)){
  var s2=SPORT[dow];
  h+='<div class="card"><span class="tag">Pas d\'école</span>'
  +chk(k+"a",'<b>Matin</b> Sport : <b>'+s2[0]+'</b>. '+esc(s2[1]))
  +chk(k+"b",'<b>4 h</b> Business, bibliothèque ou coworking')
  +chk(k+"c",'<b>Soir</b> Révision d\'anglais 30 min'+(dstr(d0)=="2026-12-21"?' · <b>Départ aujourd\'hui</b>':''))
  +'</div>';
 }else if(dow>=1&&dow<=5){
  var s=SPORT[dow];
  h+='<div class="card">'
  +chk(k+"a",'<b>6h30</b> Réveil, <b>7h20</b> départ : marche jusqu\'à Joyce-Collingwood, Expo Line vers Waterfront, descente à Burrard (environ 6 min à pied jusqu\'à l\'école)')
  +chk(k+"b",'<b>8h10–11h20</b> École d\'anglais, 755 Burrard St #300')
  +chk(k+"c",'<b>11h30–12h45</b> Sport au Robert Lee YMCA (955 Burrard St) : <b>'+s[0]+'</b>. '+esc(s[1]))
  +chk(k+"d",'<b>12h45–13h30</b> Déjeuner')
  +chk(k+"e",'<b>13h30–17h30</b> Business : '+WORK[dow])
  +chk(k+"f",'<b>18h15</b> Retour à la maison, Expo Line vers Joyce-Collingwood')
  +chk(k+"g",'<b>Soir</b> Devoirs d\'anglais 30 min + étirements 10 min')
  +'</div>';
 }else{
  var w=null;WE.forEach(function(x){var a=new Date(x[0]+"T00:00:00"),diff=Math.round((d0-a)/864e5);if(diff>=0&&diff<=1)w=x});
  if(w)h+='<div class="card we now"><span class="tag">Ce week-end</span><h3>'+w[2]+'</h3><p>'+esc(w[3])+'</p></div>';
  else h+='<div class="card"><p>Aucun week-end prévu à cette date. Repose-toi ou explore ton quartier.</p></div>';
  h+='<div class="card">'+chk(k+"s",'30 min d\'étirements ou mobilité')+chk(k+"t",'30 min de devoirs d\'anglais')+'</div>';
 }
 document.getElementById("s0").innerHTML=h;
}
function week(){
 var h='<h1>Semaine type</h1><p class="sub">École du 12 oct au 18 déc. Hors de ces dates, garde le sport et le business.</p><div class="card scroll"><table><tr><th>Heure</th><th>Programme</th></tr>'
 +'<tr><td>6h30</td><td>Réveil</td></tr><tr><td>7h20</td><td>Départ, Joyce-Collingwood → Burrard</td></tr><tr><td>8h10–11h20</td><td>École</td></tr><tr><td>11h30–12h45</td><td>Sport au YMCA</td></tr><tr><td>12h45–13h30</td><td>Déjeuner</td></tr><tr><td>13h30–17h30</td><td>Business (4 h)</td></tr><tr><td>18h15</td><td>Retour</td></tr><tr><td>Soir</td><td>Anglais 30 min, étirements 10 min</td></tr></table></div>'
 +'<h2>Sport et lieu de travail</h2>';
 for(var i=1;i<=5;i++)h+='<div class="card"><h3>'+DAYS[i]+' : '+SPORT[i][0]+'</h3><p>'+esc(SPORT[i][1])+'</p><p class="sub">Business : '+WORK[i]+'</p></div>';
 h+='<div class="note">Monte les charges de 2 à 5 % chaque semaine. Semaines plus légères : 5 et 9. Si une articulation te fait mal, change d\'exercice.</div>';
 document.getElementById("s1").innerHTML=h;
}
function weekends(){
 var n=new Date(),d0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 var h='<h1>Week-ends</h1><p class="sub">11 week-ends, du premier au départ.</p>';
 WE.forEach(function(x,i){var a=new Date(x[0]+"T00:00:00"),diff=Math.round((d0-a)/864e5),now=diff>=0&&diff<=1;
  h+='<div class="card we'+(now?' now':'')+'"><h3>'+(i+1)+'. '+x[1]+' : '+x[2]+(now?' <span class="tag">Maintenant</span>':'')+'</h3><p>'+esc(x[3])+'</p></div>'});
 h+='<h2>Groupes pour grimper et skier</h2><div class="card"><ul><li>Meetup : escalade, randonnée, ski à Vancouver</li><li>Alpine Club of Canada, section Vancouver</li><li>Hive Bouldering et Cliffhanger : soirées et débutants</li><li>Soirées de ton école d\'anglais</li></ul></div>';
 document.getElementById("s2").innerHTML=h;
}
function biz(){
 var h='<h1>Business</h1><p class="sub">Objectif : 50 000 $ en 7 semaines, avec 4 h par jour. Ambitieux : vise d\'abord des ventes régulières.</p>'
 +'<div class="note">Gérer l\'argent de clients ou conseiller des placements demande une licence (FINMA en Suisse, autorités des valeurs mobilières au Canada) : ne le fais pas. Vends des produits et des analyses, pas de la gestion. Comme visiteur, vérifie aussi les règles d\'IRCC.</div>'
 +'<div class="card"><h3>Objectif chiffré</h3><p>Par exemple 500 ventes à 100 $, ou 100 ventes à 500 $, ou un mélange avec quelques clients de service. Mesure chaque semaine : visiteurs, ventes, retours.</p></div>';
 BIZ.forEach(function(b,i){h+='<div class="card"><h3>'+b[0]+'</h3>';for(var j=1;j<b.length;j++)h+=chk("b"+i+"_"+j,esc(b[j]));h+='</div>'});
 document.getElementById("s3").innerHTML=h;
}
function infos(){
 var h='<h1>Infos pratiques</h1>'
 +'<h2>Sport</h2><div class="card"><p>'+maps("Robert Lee YMCA, 955 Burrard St, Vancouver")+'<br>À 1 min de l\'école, piscine et sauna, 5h30–22h30 du mar. au ven.</p><p>'+maps("Fit4Less, 1201 W Pender St, Vancouver")+'<br>Ouvert 24h/24, le moins cher probablement. Avis moyens.</p><p>'+maps("Fitness World, 1214 Howe St, Vancouver")+'<br>6h–22h, bon équipement.</p></div>'
 +'<h2>Coworking</h2><div class="card"><p>'+maps("VanCubers, 997 Seymour St #250, Vancouver")+'<br>Mar. à ven. 8h–18h, fermé lundi.</p><p>'+maps("Thrive Cowork, 717 W Pender St, Vancouver")+'<br>Mar. à ven. 9h–17h.</p><p>'+maps("L'Atelier Coworking, 319 W Hastings St, Vancouver")+'<br>Lun. à ven. 9h–16h, Gastown.</p></div>'
 +'<h2>Chaussons d\'escalade</h2><div class="card"><p>'+maps("Climb On Equipment, 42 E Broadway, Vancouver")+'<br>Spécialiste, bon choix de modèles et de tailles. Dim. 10h–18h.</p><p>'+maps("MEC Vancouver, 111 E 2nd Ave, Vancouver")+'<br>Grand magasin outdoor, pour comparer les prix.</p><p>'+maps("Valhalla Pure Outfitters, 88 W Broadway, Vancouver")+'<br>Autre choix outdoor à proximité.</p><p class="sub">Essaie plusieurs modèles et prends-les serrés mais supportables.</p></div>'
 +'<h2>Transports</h2><div class="card"><p>Maison → école : marche jusqu\'à Joyce-Collingwood, Expo Line vers Waterfront, descente à Burrard, environ 6 min à pied. Utilise une carte Compass et l\'app Transit pour les horaires réels.</p><p>Ski : location skis, chaussures, bâtons et casque sur place à la montagne.</p></div>'
 +'<h2>Budget : 300 CHF par semaine, midi compris</h2><div class="card scroll"><table><tr><th>Poste</th><th>CHF/sem</th></tr><tr><td>Déjeuners</td><td>90</td></tr><tr><td>Autres repas et courses</td><td>70</td></tr><tr><td>Transport</td><td>25</td></tr><tr><td>Salle et coworking</td><td>40</td></tr><tr><td>Sorties de week-end</td><td>75</td></tr></table><p class="sub">Répartition indicative à ajuster. Les semaines de ski et de l\'île coûteront plus : mets de côté sur les autres.</p></div>';
 document.getElementById("s4").innerHTML=h;
}
today();week();weekends();biz();infos();
document.body.addEventListener("change",function(e){var k=e.target.getAttribute&&e.target.getAttribute("data-k");if(k){store[k]=e.target.checked;save()}});
document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){
 document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
 document.querySelectorAll("section").forEach(function(s,i){s.classList.toggle("on",i==b.dataset.i)});
 window.scrollTo(0,0)})});
</script>
</body>
</html>
